<!DOCTYPE html>
<html lang="{{ lang or 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}{% endblock %}</title>
    {% if favicon %}
    <link rel="icon" href="{{ favicon }}" />
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* TBO palette, mirrored from desk/src/theme.css */
      :root {
        color-scheme: light;
        --brand: oklch(0.513 0.223 282);
        --brand-hover: oklch(0.46 0.219 280);
        --brand-soft: oklch(0.952 0.021 292);
        --brand-ink: oklch(0.439 0.213 279);
        --on-brand: oklch(1 0 0);
        --success: #1c7547;
        --success-soft: #e6f4ec;
        --warning: #955700;
        --warning-soft: #fdf2de;
        --danger: #bf3328;
        --danger-soft: #fdebe9;
        --info: #1e5fbf;
        --info-soft: #e7effb;
        --bg: oklch(0.976 0.003 265);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.961 0.004 268);
        --surface-3: oklch(0.949 0.006 265);
        --border: oklch(0.928 0.006 265);
        --border-strong: oklch(0.866 0.011 262);
        --ink-9: oklch(0.205 0.01 268);
        --ink-8: oklch(0.25 0.012 266);
        --ink-7: oklch(0.36 0.016 265);
        --ink-6: oklch(0.47 0.019 263);
        --ink-5: oklch(0.523 0.019 263);
        --shadow: 0 1px 2px oklch(0.2 0.01 268 / 0.06),
          0 1px 3px oklch(0.2 0.01 268 / 0.08);
        --overlay: oklch(0.2 0.01 268 / 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --brand: oklch(0.683 0.176 286);
          --brand-hover: oklch(0.73 0.15 287);
          --brand-soft: oklch(0.262 0.06 287);
          --brand-ink: oklch(0.802 0.107 289);
          --on-brand: oklch(0.2 0.06 285);
          --success: #52c48d;
          --success-soft: #14281e;
          --warning: #e3a33b;
          --warning-soft: #2e2211;
          --danger: #f0776c;
          --danger-soft: #331715;
          --info: #7fb0f5;
          --info-soft: #14233a;
          --bg: oklch(0.18 0.008 268);
          --surface: oklch(0.215 0.01 268);
          --surface-2: oklch(0.25 0.012 266);
          --surface-3: oklch(0.29 0.014 266);
          --border: oklch(0.3 0.014 266);
          --border-strong: oklch(0.38 0.016 265);
          --ink-9: oklch(0.96 0.004 265);
          --ink-8: oklch(0.91 0.006 265);
          --ink-7: oklch(0.82 0.01 265);
          --ink-6: oklch(0.74 0.014 265);
          --ink-5: oklch(0.7 0.016 265);
          --shadow: none;
          --overlay: oklch(0 0 0 / 0.6);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink-8);
        font: 400 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      a {
        color: var(--brand-ink);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
    {% block style %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %} {% block script %}{% endblock %}
  </body>
</html>
