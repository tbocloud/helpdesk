<!DOCTYPE html>
<html lang="{{ lang or 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    {% block head %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
    {% if favicon %}
    <link rel="icon" href="{{ favicon }}" />
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* TBO palette, mirrored from desk/src/theme.css */
      :root {
        color-scheme: light;
        --brand: oklch(0.513 0.223 282);
        --brand-hover: oklch(0.46 0.219 280);
        --brand-soft: oklch(0.952 0.021 292);
        --brand-ink: oklch(0.439 0.213 279);
        --on-brand: oklch(1 0 0);
        --success: #1c7547;
        --success-soft: #e6f4ec;
        --warning: #955700;
        --warning-soft: #fdf2de;
        --danger: #bf3328;
        --danger-soft: #fdebe9;
        --info: #1e5fbf;
        --info-soft: #e7effb;
        --bg: oklch(0.976 0.003 265);
        --surface: oklch(1 0 0);
        --surface-2: oklch(0.961 0.004 268);
        --surface-3: oklch(0.949 0.006 265);
        --border: oklch(0.928 0.006 265);
        --border-strong: oklch(0.866 0.011 262);
        --ink-9: oklch(0.205 0.01 268);
        --ink-8: oklch(0.25 0.012 266);
        --ink-7: oklch(0.36 0.016 265);
        --ink-6: oklch(0.47 0.019 263);
        --ink-5: oklch(0.523 0.019 263);
        --shadow: 0 1px 2px oklch(0.2 0.01 268 / 0.06),
          0 1px 3px oklch(0.2 0.01 268 / 0.08);
        --overlay: oklch(0.2 0.01 268 / 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --brand: oklch(0.683 0.176 286);
          --brand-hover: oklch(0.73 0.15 287);
          --brand-soft: oklch(0.262 0.06 287);
          --brand-ink: oklch(0.802 0.107 289);
          --on-brand: oklch(0.2 0.06 285);
          --success: #52c48d;
          --success-soft: #14281e;
          --warning: #e3a33b;
          --warning-soft: #2e2211;
          --danger: #f0776c;
          --danger-soft: #331715;
          --info: #7fb0f5;
          --info-soft: #14233a;
          --bg: oklch(0.18 0.008 268);
          --surface: oklch(0.215 0.01 268);
          --surface-2: oklch(0.25 0.012 266);
          --surface-3: oklch(0.29 0.014 266);
          --border: oklch(0.3 0.014 266);
          --border-strong: oklch(0.38 0.016 265);
          --ink-9: oklch(0.96 0.004 265);
          --ink-8: oklch(0.91 0.006 265);
          --ink-7: oklch(0.82 0.01 265);
          --ink-6: oklch(0.74 0.014 265);
          --ink-5: oklch(0.7 0.016 265);
          --shadow: none;
          --overlay: oklch(0 0 0 / 0.6);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink-8);
        font: 400 14px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      a {
        color: var(--brand-ink);
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      /* pieces shared by the portal pages */
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 64px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .muted {
        color: var(--ink-5);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .icon {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--ink-8);
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        text-decoration: none;
      }
      .btn:hover {
        background: var(--surface-2);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: var(--on-brand);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--brand-hover);
        border-color: var(--brand-hover);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--surface-2);
      }
      .btn.sm {
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
      }
      .input {
        width: 100%;
        height: 36px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
      }
      textarea.input {
        height: auto;
        min-height: 104px;
        padding: 10px 12px;
        resize: vertical;
      }
      .msg {
        min-height: 20px;
        margin: 8px 0 0;
        font-size: 13px;
      }
      .msg.err {
        color: var(--danger);
      }
      .msg.ok {
        color: var(--success);
      }
      .auth {
        max-width: 400px;
        margin: 10vh auto 0;
        padding: 28px;
      }
      .auth h1 {
        margin: 0 0 4px;
        font-size: 20px;
        font-weight: 600;
        color: var(--ink-9);
      }
      .auth p {
        margin: 0 0 20px;
      }
      .auth label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-7);
      }
      .auth .btn.primary {
        width: 100%;
        justify-content: center;
        height: 36px;
        margin-top: 12px;
      }
      .code-input {
        letter-spacing: 0.4em;
        font-size: 18px;
        text-align: center;
      }
      .link-row {
        display: flex;
        justify-content: space-between;
        margin-top: 14px;
      }
      .link-btn {
        background: none;
        border: 0;
        padding: 0;
        color: var(--brand-ink);
        cursor: pointer;
        font-size: 13px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .pill .icon {
        width: 13px;
        height: 13px;
      }
      .pill.warning {
        background: var(--warning-soft);
        color: var(--warning);
      }
      .pill.danger {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .pill.info {
        background: var(--info-soft);
        color: var(--info);
      }
      .pill.success {
        background: var(--success-soft);
        color: var(--success);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--ink-7);
        cursor: pointer;
      }
      .check input {
        width: 16px;
        height: 16px;
        accent-color: var(--brand);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--ink-9);
        color: var(--surface);
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .toast.show {
        opacity: 1;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* Touch targets: 44px controls on phones and touch screens, the same
         rule as desk/src/theme.css. :root outranks the pages' own heights. */
      @media (max-width: 639.98px), (pointer: coarse) {
        :root
          :is(.btn, .chip, .select, .input, .link-btn, .check, .viewer-nav) {
          min-height: 44px;
        }
        :root :is(.btn, .chip, .link-btn, .viewer-nav) {
          min-width: 44px;
          justify-content: center;
        }
      }
    </style>
    {% block style %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <div class="toast" id="toast" role="status"></div>
    <script>
      // helpers shared by the portal pages (content portal, training sign-off)
      window.portalKit = (function () {
        function esc(s) {
          return String(s == null ? "" : s).replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              }[c])
          );
        }

        // Lucide paths in, an icon(name) function out
        function iconSet(paths) {
          return function icon(name) {
            return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
          };
        }

        function serverMessage(body) {
          try {
            const msgs = JSON.parse(body._server_messages || "[]");
            if (msgs.length) {
              const m = JSON.parse(msgs[msgs.length - 1]);
              const div = document.createElement("div");
              div.innerHTML = m.message || "";
              return div.textContent;
            }
          } catch (e) {
            /* fall through */
          }
          return body.message || "";
        }

        // call(method, args, httpMethod) for one API module; an ended session reloads the page
        function api(prefix, csrfToken) {
          return async function call(method, args, httpMethod) {
            const opts = {
              method: httpMethod || "POST",
              headers: { Accept: "application/json" },
              credentials: "same-origin",
            };
            if (opts.method === "POST") {
              opts.headers["Content-Type"] = "application/json";
              if (csrfToken) opts.headers["X-Frappe-CSRF-Token"] = csrfToken;
              opts.body = JSON.stringify(args || {});
            }
            const res = await fetch(prefix + method, opts);
            let body = {};
            try {
              body = await res.json();
            } catch (e) {
              /* non-JSON error page */
            }
            if (!res.ok) {
              if (body.exc_type === "AuthenticationError") location.reload();
              throw new Error(
                serverMessage(body) ||
                  {{ _('Something went wrong. Try again.')|tojson }}
              );
            }
            return body.message;
          };
        }

        let toastTimer;
        function toast(text) {
          const el = document.getElementById("toast");
          el.textContent = text;
          el.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
        }

        return { esc, iconSet, api, toast };
      })();
    </script>
    {% block script %}{% endblock %}
  </body>
</html>
